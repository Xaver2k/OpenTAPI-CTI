name: OpenTapiCti Windows x64
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Adapter testen
        run: python Quelle/AdapterTest.py
      - name: TAPI-Provider kompilieren
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call Quelle\Bauen.cmd || exit /b 1
          dumpbin /exports OpenTapiCti.tsp | findstr TSPI_lineMakeCall || exit /b 1
      - name: Windows-Paket mit Bedienfenster erstellen
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name OpenTapiCti --icon assets/OpenTapiCti.ico --add-data "assets;assets" OpenTapiCti.pyw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item OpenTapiCti.tsp,Provider-Einrichten.ps1,Provider-Entfernen.ps1,Anleitung.txt dist/OpenTapiCti
      - name: Paketstruktur prüfen
        shell: pwsh
        run: |
          if (!(Test-Path dist/OpenTapiCti/OpenTapiCti.exe)) { throw "EXE fehlt" }
          if (!(Test-Path dist/OpenTapiCti/OpenTapiCti.tsp)) { throw "TAPI-Anbieter fehlt" }
          if (Get-ChildItem dist/OpenTapiCti -File -Filter *.zip) { throw "Verschachtelte ZIP gefunden" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenTapiCti-Windows-x64
          path: dist/OpenTapiCti/
          include-hidden-files: true
          if-no-files-found: error

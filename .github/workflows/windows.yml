name: CTIPilot Windows x64
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Adapter testen
        run: python Quelle/AdapterTest.py
      - name: TAPI-Provider kompilieren
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call Quelle\Bauen.cmd || exit /b 1
          dumpbin /exports FrapuriCTI.tsp | findstr TSPI_lineMakeCall || exit /b 1
      - name: Windows-Paket mit Bedienfenster erstellen
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name CTIPilot CTIPilot.pyw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item FrapuriCTI.tsp,Provider-Einrichten.ps1,Provider-Entfernen.ps1,Anleitung.txt dist/CTIPilot
          Compress-Archive dist/CTIPilot CTIPilot-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CTIPilot-Windows-x64
          path: CTIPilot-Windows-x64.zip
          if-no-files-found: error
